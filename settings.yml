nitro_site_id:
  type: string
  default: "2429"
  description: "Nitro site/loader ID: the XXXX in https://s.nitropay.com/ads-XXXX.js. Empty = no ads."
ad_show_placeholders:
  type: bool
  default: false
  description: "Show dashed placeholder boxes in the ad slots when Nitro is not configured (staging/preview only)."
header_links:
  type: objects
  description: "Header menu. Leave 'Parent' empty for a top-level link; set it to another link's label to nest it in that link's dropdown (a link with children becomes a dropdown and ignores its own URL). Items show in list order."
  default:
    - { label: "News", url: "/latest", description: "", parent: "", live: false, new_tab: false }
    - { label: "Download", url: "https://omega.duelistsunite.org/download", description: "", parent: "", live: false, new_tab: true }
    - { label: "Tournaments", url: "", description: "", parent: "", live: false, new_tab: false }
    - { label: "Leaderboards", url: "https://omega.duelistsunite.org/leaderboard", description: "", parent: "", live: false, new_tab: true }
    - { label: "Statistics", url: "", description: "", parent: "", live: false, new_tab: false }
    - { label: "Ranked Statistics", url: "https://omega.duelistsunite.org/statistics", description: "", parent: "Statistics", live: false, new_tab: true }
    - { label: "TCG Tier List", url: "https://omega.duelistsunite.org/wiki/yu-gi-oh-tcg-tier-list", description: "", parent: "Statistics", live: false, new_tab: true }
    - { label: "Genesys Tier List", url: "https://omega.duelistsunite.org/wiki/yu-gi-oh-genesys-tier-list", description: "", parent: "Statistics", live: false, new_tab: true }
    - { label: "Live Tournaments", url: "https://omega.duelistsunite.org/tournament", description: "", parent: "Tournaments", live: true, new_tab: true }
    - { label: "Tournaments Calendar", url: "https://omega.duelistsunite.org/calendar", description: "", parent: "Tournaments", live: false, new_tab: true }
    - { label: "Tools", url: "", description: "", parent: "", live: false, new_tab: false }
    - { label: "Web Simulator", url: "/simulator/", description: "Play ruling puzzles on the YGO Omega duel core", parent: "Tools", live: false, new_tab: true }
    - { label: "Combo Calculator", url: "https://duelistsunite.org/combo/", description: "Odds of opening your combo pieces", parent: "Tools", live: false, new_tab: true }
    - { label: "Banlist Creator", url: "https://forum.duelistsunite.org/banlist-creator/", description: "Build and share your own banlist", parent: "Tools", live: false, new_tab: true }
    - { label: "Card Creator", url: "https://forum.duelistsunite.org/card-creator/", description: "Make custom cards and your own Omega card database", parent: "Tools", live: false, new_tab: true }
  schema:
    name: Link
    identifier: label
    properties:
      label: { type: string, required: true }
      url: { type: string }
      description: { type: string }
      parent: { type: string }
      icon_upload: { type: upload }
      icon: { type: string, description: "Used when no upload is set: image URL or inline <svg ...> markup" }
      live: { type: boolean }
      new_tab: { type: boolean }
icon_search_upload:
  type: upload
  default: ""
  description: "Upload for the search icon (SVG/PNG, transparent background). Wins over the text field below."
icon_search:
  type: string
  default: ""
  description: "Replaces the header search icon. Image URL (SVG/PNG, transparent background) or inline <svg ...> markup. Tinted with the header text color."
icon_chat_upload:
  type: upload
  default: ""
  description: "Upload for the chat icon (SVG/PNG, transparent background). Wins over the text field below."
icon_chat:
  type: string
  default: ""
  description: "Replaces the header chat icon (same rules as the search icon)."
icon_menu_upload:
  type: upload
  default: ""
  description: "Upload for the menu icon (SVG/PNG, transparent background). Wins over the text field below."
icon_menu:
  type: string
  default: ""
  description: "Replaces the header navigation menu (hamburger) icon (same rules as the search icon)."
hero_art_style:
  type: enum
  default: duotone
  choices:
    - duotone
    - original
    - none
  description: "Homepage hero background: dragon art in the forum's navy/cyan (duotone), in its own colours darkened (original), or none."
show_mascots:
  type: bool
  default: true
  description: "Show KurAi and ShirAi behind the homepage stats panel (wide screens only)."
